  "/assistance/rebills":
    post:
      summary: "Выставить МИГ счёт на возмещение за месяц"
      description: "Строки, оплаченные клиникам в периоде (или переданные `lineIds`), плюс вознаграждение по договору. Счёт сразу отправляется в МИГ; автоматические проверки видны в `lines[].checks`."
      tags:
        - "Ассистанс: счета МИГ"
      security:
        - oauth2:
            - "rebills:write"
      parameters:
        - schema:
            type: string
            maxLength: 128
            description: "Повтор с тем же ключом в течение 24 часов вернёт первый ответ"
          required: false
          name: Idempotency-Key
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                period:
                  type: string
                  pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
                lineIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 2000
              required:
                - period
              additionalProperties: false
              example:
                period: "2026-09"
      responses:
        "201":
          description: "Счёт"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Rebill"
        "400":
          description: "Некорректный запрос"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/Problem"
        "401":
          description: "Нет токена, токен истёк или ключ отозван"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/Problem"
        "403":
          description: "Нет области доступа или IP не в списке"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/Problem"
        "404":
          description: "Не найдено (в том числе объект другой клиники или визит без действия)"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/Problem"
        "409":
          description: "Действие невозможно в текущем состоянии"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/Problem"
        "422":
          description: "Ошибка проверки данных"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/Problem"
        "429":
          description: "Превышен лимит 60 запросов в минуту (заголовок Retry-After)"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/Problem"
