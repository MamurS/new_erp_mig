        serviceName:
          type: string
        icd10:
          type: string
        estimatedCost:
          type: integer
        approvedAmount:
          type: integer
        validUntil:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        status:
          type: string
          enum:
            - requested
            - info_requested
