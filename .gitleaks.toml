# Demo credentials from SPEC §2 are intentionally public and fictional.
[extend]
useDefault = true

[allowlist]
description = "Fictional demo accounts and test fixtures of the prototype"
# abcdefghijklmnop_123: a made-up card token in src/shared/integration/integration.test.ts
# Novyi-parol-2026: the made-up password the invitation tests set (apps/api, the mock, e2e)
regexes = ['''Demo-2026!''', '''abcdefghijklmnop_123''', '''Novyi-parol-2026''']
# supabase/seed.sql is generated from the fictional demo seed (packages/seed): key hashes and webhook signing
# secrets of the demo integrations, a dev-only HMAC key. No real environment loads it.
paths = ['''supabase/seed\.sql''']
