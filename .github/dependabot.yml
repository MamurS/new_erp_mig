version: 2
updates:
  # npm: all minor and patch updates arrive together as one PR per week.
  # Major versions are ignored for now: they need code migrations and are planned by hand (see docs/DECISIONS.md).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # GitHub Actions: updates arrive as a separate grouped PR per week; major versions are ignored as well.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
