name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high

  # The e2e suite is split in two shards that run side by side (one job was close to its time limit).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @mig/web -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Database: migrations, seed and the pgTAP tests (RLS matrix, scenarios, audit) on a local Supabase Postgres.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase db reset
      - run: npx supabase test db

  # The API (step 4): Fastify over Postgres with RLS, Supabase Auth (GoTrue: TOTP, phone codes, hooks) and
  # Storage. Conformance memory ↔ postgres and integration tests of the app (sign-in, BFF sessions, CSRF,
  # encryption, files, jobs, production mode) against the local Supabase stack with migrations and seed applied.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Postgres, Auth, Storage and Kong (the services the API uses); the rest of the stack is not needed.
      - run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,realtime,mailpit,postgres-meta
      - run: npx supabase db reset
      # Mailpit catches the invitation e-mails (docker-compose.test.yml).
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - run: npm run api:build
      - name: Supabase URL and service role key for the tests
        run: npx supabase status -o env --override-name api.url=SUPABASE_URL --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY | grep -E '^(SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY)=' | tr -d '"' >> "$GITHUB_ENV"
      - run: npm run api:test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          APP_ENV: ci
          MAILPIT_URL: http://127.0.0.1:8025

  # The whole e2e suite against the real backend (BACKEND_SPEC §12.3; required to merge): the local Supabase stack
  # with the seed, the API (APP_ENV=ci: demo reset, failure simulation, test clock, «Войти как…», test MFA codes) and
  # the app built with VITE_USE_MOCKS=false behind `vite preview`, which proxies /api to the API (one origin, the
  # session cookie is first-party). Tests share the database and reset it before each, so a shard runs them one at a
  # time; eight shards, each with its own Supabase stack, keep the job within its time limit (README «e2e против бэкенда»).
  e2e-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,realtime,mailpit,postgres-meta
      - run: npx supabase db reset
      # Mailpit catches the invitation e-mails the API sends (docker-compose.test.yml; e2e/invitations.spec.ts).
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - run: npm run api:build
      - name: Supabase URL and service role key for the API
        run: npx supabase status -o env --override-name api.url=SUPABASE_URL --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY | grep -E '^(SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY)=' | tr -d '"' >> "$GITHUB_ENV"
      - run: npm run test:e2e -w @mig/web -- --shard=${{ matrix.shard }}/8
        env:
          E2E_BACKEND: '1'
          # Two API processes behind a round-robin balancer: nothing of a request may live in one process.
          E2E_API_REPLICAS: '2'
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          MAILPIT_URL: http://127.0.0.1:8025
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-backend-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # One check for the branch protection rule (required to merge): green only when every shard of e2e-backend is.
  e2e-backend-result:
    name: e2e-backend
    if: always()
    needs: e2e-backend
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-backend.result }}" = success

  # Deployment (BACKEND_SPEC §11): the backup round trip of the local Supabase stack (dump → restore into a fresh
  # stack of deploy/docker-compose.yml → row counts and the audit hash chain) and the whole production stack on this
  # machine: images of deploy/Dockerfile, migrations, Caddy with the headers of _headers, no demo routes, the first
  # administrator signing in with TOTP, a backup of it restored again (deploy/README.md).
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/caddy-headers.mjs
      - run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,realtime,mailpit,postgres-meta
      - run: npx supabase db reset
      - run: sh deploy/backup/test-local.sh
      - run: sh deploy/scripts/smoke-test.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The one check for the branch protection rule: green only when every required job passed — check, gitleaks and
  # every shard of e2e and e2e-backend (a failed, cancelled or skipped job fails it). `always()` keeps it from being
  # skipped when a dependency fails: a skipped required check would count as passed.
  ci-required:
    if: always()
    needs: [check, gitleaks, e2e, e2e-backend]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
